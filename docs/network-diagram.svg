<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Homelab network architecture</title>
  <style>
    .t  { font-size: 14px; font-weight: 600; fill: #111827; }
    .s  { font-size: 12px; fill: #374151; }
    .xs { font-size: 11px; fill: #4b5563; }
    .box{ stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Homelab network architecture</text>
  <text x="500" y="57" text-anchor="middle" class="s">Zones and trust model · simplified, no addressing shown</text>

  <!-- Internet and modem -->
  <ellipse cx="500" cy="98" rx="70" ry="20" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="500" y="103" text-anchor="middle" class="t">Internet</text>
  <line x1="500" y1="118" x2="500" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="420" y="140" width="160" height="40" rx="8" class="box" fill="#fef2f2" stroke="#c0392b"/>
  <text x="500" y="165" text-anchor="middle" class="t">ISP modem</text>
  <line x1="500" y1="180" x2="500" y2="210" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Firewall -->
  <rect x="320" y="210" width="360" height="86" rx="8" class="box" fill="#f9fafb" stroke="#111827"/>
  <text x="500" y="236" text-anchor="middle" class="t">Next-generation firewall</text>
  <text x="500" y="257" text-anchor="middle" class="s">Routing · inter-zone policy · DHCP · time source</text>
  <text x="500" y="278" text-anchor="middle" class="xs">Default deny between zones · no management from the internet</text>

  <!-- Out-of-band -->
  <line x1="680" y1="253" x2="770" y2="253" stroke="#d97706" stroke-width="2.5"/>
  <rect x="770" y="223" width="190" height="60" rx="8" class="box" fill="#fffbeb" stroke="#d97706"/>
  <text x="865" y="248" text-anchor="middle" class="t">Out-of-band admin</text>
  <text x="865" y="267" text-anchor="middle" class="xs">Dedicated recovery path</text>

  <!-- Trunk -->
  <line x1="500" y1="296" x2="500" y2="350" stroke="#374151" stroke-width="4"/>
  <text x="512" y="328" class="xs">802.1Q trunk, all zones</text>

  <!-- Switch -->
  <rect x="320" y="350" width="360" height="50" rx="8" class="box" fill="#f9fafb" stroke="#111827"/>
  <text x="500" y="380" text-anchor="middle" class="t">Managed switch</text>

  <!-- Zone links -->
  <line x1="420" y1="400" x2="170" y2="460" stroke="#6b7280" stroke-width="2.5"/>
  <line x1="500" y1="400" x2="500" y2="460" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="580" y1="400" x2="830" y2="460" stroke="#059669" stroke-width="2.5"/>

  <!-- Management zone -->
  <rect x="60" y="460" width="220" height="110" rx="8" class="box" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="170" y="486" text-anchor="middle" class="t">Management zone</text>
  <text x="170" y="508" text-anchor="middle" class="s">Network device management</text>
  <text x="170" y="528" text-anchor="middle" class="xs">Reachable only from trusted sources</text>

  <!-- Trusted zone -->
  <rect x="390" y="460" width="220" height="110" rx="8" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="500" y="486" text-anchor="middle" class="t">Trusted zone</text>
  <text x="500" y="508" text-anchor="middle" class="s">Workstation · Wi-Fi access point</text>
  <text x="500" y="528" text-anchor="middle" class="xs">Phones, laptops, streaming devices</text>
  <text x="500" y="546" text-anchor="middle" class="xs">DNS forced through the filter</text>

  <!-- Servers zone -->
  <rect x="720" y="460" width="220" height="110" rx="8" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="830" y="486" text-anchor="middle" class="t">Servers zone</text>
  <text x="830" y="508" text-anchor="middle" class="s">Home server</text>
  <text x="830" y="528" text-anchor="middle" class="xs">DNS filtering · media · file sharing</text>
  <text x="830" y="546" text-anchor="middle" class="xs">Web-based server management</text>

  <!-- Trusted to Servers flows -->
  <line x1="612" y1="500" x2="716" y2="500" stroke="#059669" stroke-width="2" marker-end="url(#ok)"/>
  <text x="664" y="492" text-anchor="middle" class="xs">approved</text>
  <line x1="718" y1="530" x2="614" y2="530" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#no)"/>
  <text x="664" y="548" text-anchor="middle" class="xs">blocked</text>

  <!-- Policy summary -->
  <rect x="60" y="600" width="880" height="118" rx="8" class="box" fill="#ffffff" stroke="#d1d5db"/>
  <text x="80" y="626" class="t">Trust model</text>
  <g class="s">
    <text x="80" y="650">✓ Trusted → Servers: approved application services only</text>
    <text x="80" y="672">✗ Servers → Trusted: blocked, so a compromised server can't reach users</text>
    <text x="80" y="694">✓ Management: only from trusted sources and out-of-band</text>
    <text x="560" y="650">✓ Trusted and Servers → Internet, with NAT</text>
    <text x="560" y="672">✗ Outside DNS resolvers: blocked for Trusted</text>
    <text x="560" y="694">✗ Internet → anything inside</text>
  </g>

  <!-- Legend -->
  <g class="xs">
    <line x1="60" y1="742" x2="90" y2="742" stroke="#6b7280" stroke-width="2.5"/><text x="98" y="746">Management</text>
    <line x1="190" y1="742" x2="220" y2="742" stroke="#2563eb" stroke-width="2.5"/><text x="228" y="746">Trusted</text>
    <line x1="300" y1="742" x2="330" y2="742" stroke="#059669" stroke-width="2.5"/><text x="338" y="746">Servers</text>
    <line x1="410" y1="742" x2="440" y2="742" stroke="#d97706" stroke-width="2.5"/><text x="448" y="746">Out-of-band</text>
    <line x1="540" y1="742" x2="570" y2="742" stroke="#c0392b" stroke-width="2.5"/><text x="578" y="746">WAN</text>
  </g>
</svg>
